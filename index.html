<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anaële Accompagnement</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #6E6E6E;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        header {
            text-align: center;
            padding: 80px 20px;
            background: rgba(247, 243, 239, 0.85);
        }

        header img {
            width: 180px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #4A6A8A;
        }

        header p {
            font-size: 20px;
            max-width: 700px;
            margin: auto;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 40px;
        }

        .menu a {
            display: block;
            padding: 30px;
            background: rgba(255, 255, 255, 0.85);
            text-align: center;
            text-decoration: none;
            color: #4A6A8A;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid #E8BFC8;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #E8BFC8;
            color: white;
        }

        .contact {
            background: rgba(247, 243, 239, 0.95);
            padding: 40px;
            margin: 40px;
            border-radius: 10px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            border: 2px solid #A7C4A0;
        }

        .contact h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #4A6A8A;
        }

        .contact form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact input, .contact textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .contact button {
            padding: 12px;
            background: #A7C4A0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .contact button:hover {
            background: #4A6A8A;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(247, 243, 239, 0.85);
            margin-top: 40px;
        }

        footer a {
            color: #4A6A8A;
            text-decoration: none;
            font-size: 16px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header>
    <img src="logo.lpg" alt="Logo Anaële Accompagnement">
    <h1>Anaële Accompagnement</h1>
    <p>
        Un accompagnement bienveillant dédié à la petite enfance et au soutien parental.
        Massages, réflexologie, écoute et guidance pour un développement harmonieux.
    </p>
</header>

<section class="menu">
    <a href="qui-je-suis.html">Qui je suis</a>
    <a href="massage-reflexologie.html">Massage & Réflexologie</a>
    <a href="accompagnement.html">Accompagnement petite enfance</a>
    <a href="prestations.html">Prestations</a>
</section>

<section class="contact">
    <h2>Contact</h2>
    <form action="https://formspree.io/f/xxxxxxxx" method="POST">
        <input type="text" name="nom" placeholder="Votre nom" required>
        <input type="email" name="email" placeholder="Votre email" required>
        <textarea name="message" rows="5" placeholder="Votre message" required></textarea>
        <button type="submit">Envoyer</button>
    </form>
</section>

<footer>
    <a href="cgv.html">Conditions Générales de Vente</a>
</footer>

</body>
</html>
